ingestion.sources = spool
ingestion.channels = disk
ingestion.sinks = hdfs

# JSON Lines/log: one complete UTF-8 record per line, no compressed files.
ingestion.sources.spool.type = spooldir
ingestion.sources.spool.spoolDir = /ingestion/spool
ingestion.sources.spool.channels = disk
ingestion.sources.spool.includePattern = ^.*[.](jsonl|ndjson|log|txt)$
ingestion.sources.spool.ignorePattern = ^[.].*$
ingestion.sources.spool.deserializer = LINE
ingestion.sources.spool.deserializer.maxLineLength = 1048576
ingestion.sources.spool.inputCharset = UTF-8
ingestion.sources.spool.fileSuffix = .COMPLETED
ingestion.sources.spool.deletePolicy = never
ingestion.sources.spool.basenameHeader = true
ingestion.sources.spool.basenameHeaderKey = basename
ingestion.sources.spool.batchSize = 1000

# Persistent channel checkpoint/logs; source tracking is retained in spool.
ingestion.channels.disk.type = file
ingestion.channels.disk.checkpointDir = /var/lib/flume/checkpoint
ingestion.channels.disk.dataDirs = /var/lib/flume/data
ingestion.channels.disk.capacity = 1000000
ingestion.channels.disk.transactionCapacity = 1000

ingestion.sinks.hdfs.type = hdfs
ingestion.sinks.hdfs.channel = disk
ingestion.sinks.hdfs.hdfs.path = hdfs://namenode:8020/project/raw/${env:DATASET_NAME}/${env:DATASET_VERSION}/%{basename}
ingestion.sinks.hdfs.hdfs.filePrefix = events-
ingestion.sinks.hdfs.hdfs.fileSuffix = .jsonl
ingestion.sinks.hdfs.hdfs.fileType = DataStream
ingestion.sinks.hdfs.serializer = TEXT
ingestion.sinks.hdfs.serializer.appendNewline = true
ingestion.sinks.hdfs.hdfs.batchSize = 1000
ingestion.sinks.hdfs.hdfs.rollInterval = 0
ingestion.sinks.hdfs.hdfs.rollSize = 134217728
ingestion.sinks.hdfs.hdfs.rollCount = 0
ingestion.sinks.hdfs.hdfs.idleTimeout = 15
ingestion.sinks.hdfs.hdfs.minBlockReplicas = 1
